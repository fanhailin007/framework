spring:
  application:
    name: linkedyou
  main:
    allow-bean-definition-overriding=true:
  
  datasource:
    url: jdbc:mysql://10.211.55.20:3306/LinkedyouDev
      ?connectTimeout=5000
      &socketTimeout=10000
      &tcpKeepAlive=true
      &allowPublicKeyRetrieval=true
      &sslMode=DISABLED
      &useSSL=false
      &serverTimezone=Asia/Tokyo
      &characterEncoding=utf8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

storage:
  local:
    root: /Users/hailinfan/data/docs
    max-file-size: 50MB

app:
  cors:
    allowed-origins:
      - http://localhost:5200
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5200
      - http://127.0.0.1:5173
      - http://127.0.0.1:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Authorization
    exposed-headers:
      - Content-Disposition
    allow-credentials: true
    max-age: 3600

security:
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    max-failed-attempts: 5
    lock-duration: 15m
  password-policy:
    enabled: true
    min-length: 8
    max-length: 100
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
    reject-whitespace: true
    
mybatis-plus:
  global-config:
    db-config:
      id-type: AUTO

    
