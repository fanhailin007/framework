openapi: 3.0.3
info:
  title: LinkedYou Backend API
  description: LinkedYou 后端当前已实现 REST API 的 OpenAPI 3.0 文档。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Users
    description: 用户管理 API
  - name: Documents
    description: 文档管理 API
paths:
  /api/users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: 查询用户列表
      description: 查询所有未软删除用户，当前接口未分页。
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              examples:
                success:
                  summary: 用户列表响应
                  value:
                    success: true
                    code: OK
                    message: success
                    data:
                      - id: 1
                        userId: admin
                        displayName: 系统管理员
                        role: Admin
                        email: admin@example.com
                        phone: "13900000001"
                        avatar: /avatars/admin.png
                        active: true
                        lastLoginAt: "2026-06-26T18:30:00"
                        lastLoginIp: 127.0.0.1
                        createdAt: "2026-06-01T09:00:00"
                        updatedAt: "2026-06-26T18:30:00"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Users
      operationId: createUser
      summary: 创建用户
      description: 创建新用户。`userId` 在未软删除用户中必须唯一，密码不会在响应中返回。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            examples:
              createUser:
                summary: 创建用户请求
                value:
                  userId: postman_user_001
                  password: PostmanPass123!
                  displayName: Postman Test User
                  role: Admin
                  email: postman_user_001@example.com
                  phone: "13900001001"
                  avatar: /avatars/postman.png
                  active: true
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "400":
          description: 参数校验失败或用户ID重复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError:
                  summary: 参数校验失败
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: "userId: must not be blank; password: must not be blank"
                    data: null
                userIdExists:
                  summary: 用户ID重复
                  value:
                    success: false
                    code: USERNAME_EXISTS
                    message: username already exists
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/login:
    post:
      tags:
        - Users
      operationId: loginUser
      summary: 用户登录
      description: 校验 `userId` 和密码。成功后写入 `user_sessions`，返回 access token、refresh token 和用户信息；成功、失败、禁用和锁定都会写入 `user_login_logs`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                summary: 登录请求
                value:
                  userId: admin
                  password: Password123!
                  deviceId: postman-device
                  deviceName: Postman Runtime
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
              examples:
                success:
                  summary: 登录成功响应
                  value:
                    success: true
                    code: OK
                    message: success
                    data:
                      accessToken: eyJleGFtcGxl
                      refreshToken: refresh_example
                      tokenType: Bearer
                      issuedAt: "2026-06-27T23:30:00"
                      expiresAt: "2026-06-28T00:00:00"
                      refreshExpiresAt: "2026-07-27T23:30:00"
                      user:
                        id: 1
                        userId: admin
                        displayName: 系统管理员
                        role: Admin
                        email: admin@example.com
                        active: true
        "400":
          description: 参数校验失败、用户ID或密码错误、账号禁用或账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                loginFailed:
                  summary: 用户ID或密码错误
                  value:
                    success: false
                    code: LOGIN_FAILED
                    message: invalid user id or password
                    data: null
                accountDisabled:
                  summary: 账号禁用
                  value:
                    success: false
                    code: ACCOUNT_DISABLED
                    message: account is disabled
                    data: null
                accountLocked:
                  summary: 账号锁定
                  value:
                    success: false
                    code: ACCOUNT_LOCKED
                    message: account is locked
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/refresh-token:
    post:
      tags:
        - Users
      operationId: refreshUserToken
      summary: 刷新 access token
      description: 使用有效 refresh token 刷新 access token。当前实现不轮换 refresh token，数据库中的 `refresh_token_hash` 保持不变，响应会返回原 refresh token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            examples:
              refresh:
                summary: 刷新 token 请求
                value:
                  refreshToken: refresh_example
      responses:
        "200":
          description: access token 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
              examples:
                success:
                  summary: 刷新成功响应
                  value:
                    success: true
                    code: OK
                    message: success
                    data:
                      accessToken: new_access_token_example
                      refreshToken: refresh_example
                      tokenType: Bearer
                      issuedAt: "2026-06-28T11:30:00"
                      expiresAt: "2026-06-28T12:00:00"
                      refreshExpiresAt: "2026-07-27T23:30:00"
                      user:
                        id: 1
                        userId: admin
                        displayName: 系统管理员
                        role: Admin
                        email: admin@example.com
                        active: true
        "400":
          description: 参数校验失败、refresh token 无效、用户不存在或账号禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenInvalid:
                  summary: token 无效
                  value:
                    success: false
                    code: TOKEN_INVALID
                    message: token is invalid
                    data: null
                accountDisabled:
                  summary: 账号禁用
                  value:
                    success: false
                    code: ACCOUNT_DISABLED
                    message: account is disabled
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/logout:
    post:
      tags:
        - Users
      operationId: logoutUser
      summary: 用户登出
      description: 根据 `Authorization` Bearer token 撤销 `user_sessions` 中的当前会话。
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer access token。
          schema:
            type: string
          example: Bearer eyJleGFtcGxl
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidResponse"
        "400":
          description: 缺少、格式错误、已过期或已撤销的 token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tokenInvalid:
                  summary: token 无效
                  value:
                    success: false
                    code: TOKEN_INVALID
                    message: token is invalid
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/{id}:
    get:
      tags:
        - Users
      operationId: getUserById
      summary: 查询单个用户
      description: 根据主键 ID 查询未软删除用户。
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "400":
          description: ID 为负数、用户不存在或用户已软删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: 用户不存在
                  value:
                    success: false
                    code: USER_NOT_FOUND
                    message: user not found
                    data: null
                validationError:
                  summary: ID 参数校验失败
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: "getById.id: must be greater than or equal to 0"
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Users
      operationId: updateUser
      summary: 更新用户
      description: 更新指定用户。请求体字段均为可选字段，只更新传入字段。
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
            examples:
              updateUser:
                summary: 更新用户请求
                value:
                  userId: postman_user_001_updated
                  password: PostmanPass456!
                  displayName: Postman Updated User
                  role: Editor
                  email: updated_postman_user_001@example.com
                  phone: "13900001001"
                  avatar: /avatars/postman-updated.png
                  active: false
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "400":
          description: 参数校验失败、用户不存在或用户ID重复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: 用户不存在
                  value:
                    success: false
                    code: USER_NOT_FOUND
                    message: user not found
                    data: null
                validationError:
                  summary: 参数校验失败
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: "password: size must be between 8 and 100"
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Users
      operationId: deleteUser
      summary: 软删除用户
      description: 软删除指定用户，写入 `deleted_at`，不会物理删除数据库记录。
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidResponse"
              examples:
                success:
                  summary: 删除成功响应
                  value:
                    success: true
                    code: OK
                    message: success
                    data: null
        "400":
          description: ID 为负数、用户不存在或用户已软删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: 用户不存在
                  value:
                    success: false
                    code: USER_NOT_FOUND
                    message: user not found
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/{id}/password:
    put:
      tags:
        - Users
      operationId: changeUserPassword
      summary: 更改用户密码
      description: 校验当前密码后更改用户密码。新密码按 `application.yml` 中 `security.password-policy` 规则校验，规则可通过 `enabled` 开关启用或关闭。
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserChangePasswordRequest"
            examples:
              changePassword:
                summary: 更改密码请求
                value:
                  currentPassword: PostmanPass456!
                  newPassword: PostmanPass789!
      responses:
        "200":
          description: 更改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidResponse"
              examples:
                success:
                  summary: 更改成功响应
                  value:
                    success: true
                    code: OK
                    message: success
                    data: null
        "400":
          description: 参数校验失败、用户不存在、当前密码错误或新密码不符合策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                currentPasswordInvalid:
                  summary: 当前密码错误
                  value:
                    success: false
                    code: CURRENT_PASSWORD_INVALID
                    message: current password is invalid
                    data: null
                passwordPolicyViolation:
                  summary: 新密码不符合策略
                  value:
                    success: false
                    code: PASSWORD_POLICY_VIOLATION
                    message: "password does not match policy: Password must contain at least 1 special characters."
                    data: null
                userNotFound:
                  summary: 用户不存在
                  value:
                    success: false
                    code: USER_NOT_FOUND
                    message: user not found
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/documents:
    get:
      tags:
        - Documents
      operationId: listDocuments
      summary: 查询文档列表
      description: 查询未软删除文档，可按状态过滤。当前接口未分页。
      parameters:
        - name: status
          in: query
          required: false
          description: 文档状态，可选 `draft`、`published`、`archived`。
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
          example: published
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "400":
          description: 文档状态无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                statusInvalid:
                  summary: 状态无效
                  value:
                    success: false
                    code: DOCUMENT_STATUS_INVALID
                    message: document status is invalid
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Documents
      operationId: createDocument
      summary: 创建文档
      description: 创建草稿文档。`slug` 在未软删除文档中必须唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreateRequest"
            examples:
              createDocument:
                summary: 创建文档请求
                value:
                  title: Postman Document
                  slug: postman-document
                  summary: Postman 创建的测试文档
                  content: "# Postman Document"
                  ownerUserId: 1
                  category: guide
                  tags:
                    - postman
                    - guide
                  createdByUserId: 1
                  updatedByUserId: 1
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseEnvelope"
        "400":
          description: 参数校验失败或 slug 重复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/documents/upload:
    post:
      tags:
        - Documents
      operationId: uploadDocument
      summary: 上传 PDF 并创建文档
      description: 接收前端 multipart 表单，上传 PDF 文件并把表单信息写入 `documents` 表。只允许 PDF，服务端会校验扩展名、Content-Type 和文件头。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadRequest"
      responses:
        "200":
          description: 上传并创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseEnvelope"
        "400":
          description: 参数校验失败、文件缺失、非 PDF、文件过大或 slug 重复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fileRequired:
                  summary: 文件缺失
                  value:
                    success: false
                    code: DOCUMENT_FILE_REQUIRED
                    message: document file is required
                    data: null
                fileInvalid:
                  summary: 非 PDF 文件
                  value:
                    success: false
                    code: DOCUMENT_FILE_INVALID
                    message: only PDF files are allowed
                    data: null
                fileTooLarge:
                  summary: 文件过大
                  value:
                    success: false
                    code: DOCUMENT_FILE_TOO_LARGE
                    message: document file is too large
                    data: null
                slugExists:
                  summary: slug 重复
                  value:
                    success: false
                    code: DOCUMENT_SLUG_EXISTS
                    message: document slug already exists
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/documents/{id}:
    get:
      tags:
        - Documents
      operationId: getDocumentById
      summary: 查询单个文档
      description: 根据主键 ID 查询未软删除文档。
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseEnvelope"
        "400":
          description: ID 为负数、文档不存在或文档已软删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Documents
      operationId: updateDocument
      summary: 更新文档
      description: 更新指定文档。请求体字段均为可选字段，只更新传入字段，更新后版本号递增。
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdateRequest"
            examples:
              updateDocument:
                summary: 更新文档请求
                value:
                  title: Updated Postman Document
                  slug: updated-postman-document
                  summary: Postman 更新后的测试文档
                  tags:
                    - postman
                    - updated
                  updatedByUserId: 1
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseEnvelope"
        "400":
          description: 参数校验失败、文档不存在或 slug 重复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Documents
      operationId: deleteDocument
      summary: 软删除文档
      description: 软删除指定文档，写入 `deleted_at`，不会物理删除数据库记录。
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidResponse"
        "400":
          description: ID 为负数、文档不存在或文档已软删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/documents/{id}/pdf:
    get:
      tags:
        - Documents
      operationId: openDocumentPdf
      summary: 读取 PDF 文件
      description: 根据文档 ID 读取已上传 PDF，返回 `application/pdf` 二进制内容，前端可使用 iframe、embed 或浏览器 PDF viewer 展示。
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: PDF 文件内容
          headers:
            Content-Disposition:
              description: 使用 `inline` 让浏览器直接预览 PDF。
              schema:
                type: string
                example: inline; filename="document.pdf"
            Content-Length:
              description: PDF 文件大小。
              schema:
                type: integer
                format: int64
                example: 204800
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: 文档不存在、文档未绑定文件、文件丢失、路径非法或文件不是 PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fileNotAvailable:
                  summary: 文档未绑定文件
                  value:
                    success: false
                    code: DOCUMENT_FILE_NOT_AVAILABLE
                    message: document file is not available
                    data: null
                fileNotFound:
                  summary: 文件不存在
                  value:
                    success: false
                    code: DOCUMENT_FILE_NOT_FOUND
                    message: document file is not found
                    data: null
                fileInvalid:
                  summary: 非法文件
                  value:
                    success: false
                    code: DOCUMENT_FILE_INVALID
                    message: only PDF files are allowed
                    data: null
        "500":
          $ref: "#/components/responses/InternalError"
  /api/documents/{id}/publish:
    post:
      tags:
        - Documents
      operationId: publishDocument
      summary: 发布文档
      description: 将文档状态设置为 `published`，记录审核人、更新人和发布时间。
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPublishRequest"
            examples:
              publishDocument:
                summary: 发布文档请求
                value:
                  reviewedBy: 1
                  updatedByUserId: 1
      responses:
        "200":
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseEnvelope"
        "400":
          description: 参数校验失败、文档不存在或文档已软删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/documents/{id}/archive:
    post:
      tags:
        - Documents
      operationId: archiveDocument
      summary: 归档文档
      description: 将文档状态设置为 `archived`。
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: 归档成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseEnvelope"
        "400":
          description: ID 为负数、文档不存在或文档已软删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      description: 用户主键 ID，必须大于等于 0。
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1
    DocumentIdPath:
      name: id
      in: path
      required: true
      description: 文档主键 ID，必须大于等于 0。
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1
  responses:
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalError:
              summary: 内部错误响应
              value:
                success: false
                code: INTERNAL_ERROR
                message: internal server error
                data: null
  schemas:
    LoginRequest:
      type: object
      required:
        - userId
        - password
      properties:
        userId:
          type: string
          description: 登录用户ID。
          maxLength: 64
          example: admin
        password:
          type: string
          description: 登录密码。
          maxLength: 100
          format: password
          example: Password123!
        deviceId:
          type: string
          nullable: true
          description: 前端设备 ID。
          maxLength: 128
          example: postman-device
        deviceName:
          type: string
          nullable: true
          description: 前端设备名称。
          maxLength: 150
          example: Postman Runtime
        ipAddress:
          type: string
          nullable: true
          description: 登录 IP。前端不传时后端从请求中获取。
          maxLength: 45
          example: 127.0.0.1
        userAgent:
          type: string
          nullable: true
          description: User-Agent。前端不传时后端从请求头获取。
          maxLength: 500
          example: PostmanRuntime/7
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: 登录或上次刷新返回的 refresh token。当前实现不轮换该 token。
          maxLength: 512
          example: refresh_example
    UserCreateRequest:
      type: object
      required:
        - userId
        - password
      properties:
        userId:
          type: string
          description: 登录用户ID，未软删除用户中必须唯一。
          maxLength: 64
          example: postman_user_001
        password:
          type: string
          description: 登录密码，服务端使用 BCrypt 哈希后保存，响应中不会返回。
          minLength: 8
          maxLength: 100
          format: password
          example: PostmanPass123!
        displayName:
          type: string
          nullable: true
          description: 显示名称或昵称。
          maxLength: 100
          example: Postman Test User
        role:
          type: string
          nullable: true
          description: 用户角色。
          maxLength: 100
          example: Admin
        email:
          type: string
          nullable: true
          description: 邮箱地址。
          format: email
          maxLength: 191
          example: postman_user_001@example.com
        phone:
          type: string
          nullable: true
          description: 手机号。
          maxLength: 32
          example: "13900001001"
        avatar:
          type: string
          nullable: true
          description: 头像路径。
          maxLength: 255
          example: /avatars/postman.png
        active:
          type: boolean
          nullable: true
          description: 是否启用。不传时默认为 `true`。
          example: true
    UserUpdateRequest:
      type: object
      description: 更新用户请求。所有字段均可选，只更新传入字段。
      properties:
        userId:
          type: string
          nullable: true
          description: 登录用户ID，未软删除用户中必须唯一。
          maxLength: 64
          example: postman_user_001_updated
        password:
          type: string
          nullable: true
          description: 新登录密码，服务端使用 BCrypt 哈希后保存，响应中不会返回。
          minLength: 8
          maxLength: 100
          format: password
          example: PostmanPass456!
        displayName:
          type: string
          nullable: true
          description: 显示名称或昵称。
          maxLength: 100
          example: Postman Updated User
        role:
          type: string
          nullable: true
          description: 用户角色。
          maxLength: 100
          example: Editor
        email:
          type: string
          nullable: true
          description: 邮箱地址。
          format: email
          maxLength: 191
          example: updated_postman_user_001@example.com
        phone:
          type: string
          nullable: true
          description: 手机号。
          maxLength: 32
          example: "13900001001"
        avatar:
          type: string
          nullable: true
          description: 头像路径。
          maxLength: 255
          example: /avatars/postman-updated.png
        active:
          type: boolean
          nullable: true
          description: 是否启用。
          example: false
    UserChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: 当前密码。
          maxLength: 100
          format: password
          example: PostmanPass456!
        newPassword:
          type: string
          description: 新密码，按 `security.password-policy` 配置校验。
          maxLength: 100
          format: password
          example: PostmanPass789!
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 访问 token。当前为不透明随机 token。
          example: eyJleGFtcGxl
        refreshToken:
          type: string
          description: 刷新 token。数据库只保存其 SHA-256 摘要。
          example: refresh_example
        tokenType:
          type: string
          example: Bearer
        issuedAt:
          type: string
          format: date-time
          example: "2026-06-27T23:30:00"
        expiresAt:
          type: string
          format: date-time
          description: access token 过期时间，由 `security.auth.access-token-ttl` 控制。
          example: "2026-06-28T00:00:00"
        refreshExpiresAt:
          type: string
          format: date-time
          description: refresh token 过期时间，由 `security.auth.refresh-token-ttl` 控制。
          example: "2026-07-27T23:30:00"
        user:
          $ref: "#/components/schemas/UserResponse"
    DocumentCreateRequest:
      type: object
      required:
        - title
        - slug
      properties:
        documentId:
          type: integer
          nullable: true
          format: int64
          example: 1001
        title:
          type: string
          maxLength: 255
          example: Postman Document
        slug:
          type: string
          maxLength: 255
          example: postman-document
        summary:
          type: string
          nullable: true
          maxLength: 512
          example: Postman 创建的测试文档
        content:
          type: string
          nullable: true
          example: "# Postman Document"
        ownerUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        category:
          type: string
          nullable: true
          maxLength: 100
          example: guide
        tags:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 100
          example:
            - postman
            - guide
        filePath:
          type: string
          nullable: true
          maxLength: 500
          example: /docs/postman-document.pdf
        fileSize:
          type: integer
          nullable: true
          format: int64
          example: 204800
        createdByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        updatedByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
    DocumentUploadRequest:
      type: object
      required:
        - file
        - title
        - slug
      properties:
        file:
          type: string
          format: binary
          description: PDF 文件。服务端校验 `.pdf` 扩展名、`application/pdf` Content-Type 和 `%PDF-` 文件头。
        documentId:
          type: integer
          nullable: true
          format: int64
          example: 1001
        title:
          type: string
          maxLength: 255
          example: Uploaded Postman Document
        slug:
          type: string
          maxLength: 255
          example: uploaded-postman-document
        summary:
          type: string
          nullable: true
          maxLength: 512
          example: Postman 上传的 PDF 文档
        content:
          type: string
          nullable: true
          example: "# Uploaded Postman Document"
        ownerUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        category:
          type: string
          nullable: true
          maxLength: 100
          example: guide
        tags:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 100
          example:
            - postman
            - pdf
        createdByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        updatedByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
    DocumentUpdateRequest:
      type: object
      description: 更新文档请求。所有字段均可选，只更新传入字段。
      properties:
        documentId:
          type: integer
          nullable: true
          format: int64
          example: 1001
        title:
          type: string
          nullable: true
          maxLength: 255
          example: Updated Postman Document
        slug:
          type: string
          nullable: true
          maxLength: 255
          example: updated-postman-document
        summary:
          type: string
          nullable: true
          maxLength: 512
          example: Postman 更新后的测试文档
        content:
          type: string
          nullable: true
          example: "# Updated Postman Document"
        ownerUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        category:
          type: string
          nullable: true
          maxLength: 100
          example: guide
        tags:
          type: array
          nullable: true
          items:
            type: string
            maxLength: 100
          example:
            - postman
            - updated
        filePath:
          type: string
          nullable: true
          maxLength: 500
          example: /docs/updated-postman-document.pdf
        fileSize:
          type: integer
          nullable: true
          format: int64
          example: 409600
        updatedByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
    DocumentPublishRequest:
      type: object
      properties:
        reviewedBy:
          type: integer
          nullable: true
          format: int64
          example: 1
        updatedByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
    UserResponse:
      type: object
      description: 用户响应数据，不包含密码哈希、软删除时间等内部字段。
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: string
          example: admin
        displayName:
          type: string
          nullable: true
          example: 系统管理员
        role:
          type: string
          nullable: true
          example: Admin
        email:
          type: string
          nullable: true
          format: email
          example: admin@example.com
        phone:
          type: string
          nullable: true
          example: "13900000001"
        avatar:
          type: string
          nullable: true
          example: /avatars/admin.png
        active:
          type: boolean
          example: true
        lastLoginAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-26T18:30:00"
        lastLoginIp:
          type: string
          nullable: true
          example: 127.0.0.1
        createdAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-01T09:00:00"
        updatedAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-26T18:30:00"
    DocumentResponse:
      type: object
      description: 文档响应数据，不包含软删除时间等内部字段。
      properties:
        id:
          type: integer
          format: int64
          example: 1
        documentId:
          type: integer
          nullable: true
          format: int64
          example: 1001
        title:
          type: string
          example: Postman Document
        slug:
          type: string
          example: postman-document
        summary:
          type: string
          nullable: true
          example: Postman 创建的测试文档
        content:
          type: string
          nullable: true
          example: "# Postman Document"
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          example: draft
        ownerUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        category:
          type: string
          nullable: true
          example: guide
        tags:
          type: array
          items:
            type: string
          example:
            - postman
            - guide
        filePath:
          type: string
          nullable: true
          example: /docs/postman-document.pdf
        fileSize:
          type: integer
          nullable: true
          format: int64
          example: 204800
        version:
          type: integer
          example: 1
        publishedAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-27T19:00:00"
        reviewedBy:
          type: integer
          nullable: true
          format: int64
          example: 1
        createdByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        updatedByUserId:
          type: integer
          nullable: true
          format: int64
          example: 1
        createdAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-27T18:30:00"
        updatedAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-27T19:00:00"
    UserResponseEnvelope:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/UserResponse"
    LoginResponseEnvelope:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/LoginResponse"
    UserListResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
    DocumentResponseEnvelope:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/DocumentResponse"
    DocumentListResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentResponse"
    VoidResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          nullable: true
          example: null
    ErrorResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          description: 错误码，例如 `VALIDATION_ERROR`、`USER_NOT_FOUND`、`USERNAME_EXISTS`、`INTERNAL_ERROR`。
          example: USER_NOT_FOUND
        message:
          type: string
          description: 错误消息。
          example: user not found
        data:
          nullable: true
          example: null
